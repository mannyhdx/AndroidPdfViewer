plugins {
    id 'com.android.library'
    id 'maven-publish' // optional, but keeps it clean
}

group = 'com.github.mannyhdx'
version = '3.2.0-jitpack'

android {
    compileSdkVersion 30
    namespace 'com.github.mannyhdx.androidpdfviewer'

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 30
        versionCode 1
        versionName "3.2.0-jitpack"
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    api 'com.github.barteksc:pdfium-android:1.9.0'
}
